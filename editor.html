<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RCCI · Atelier de scènes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/atelier.css">
</head>
<body class="atelier">
  <div id="app">
    <header id="topbar">
      <a class="logo" href="index.html" style="text-decoration:none;color:inherit"><div class="logo-mark">🛠️</div><div>Atelier de scènes<small id="edTitre"></small></div></a>
      <div class="hist">
        <button class="rond-s" id="bUndo" title="Annuler (Ctrl+Z)" disabled>↶</button>
        <button class="rond-s" id="bRedo" title="Rétablir (Ctrl+Y)" disabled>↷</button>
      </div>
      <div class="tb-sp"></div>
      <details class="menu"><summary class="btn btn-sm">📁 Fichier ▾</summary><div class="menu-c">
        <button class="btn btn-sm" id="bNouveau">Nouveau dossier</button>
        <button class="btn btn-sm" id="bCharger">Ouvrir…</button>
        <button class="btn btn-sm" id="bVariante" title="Même bâtiment, nouvel identifiant">Créer une variante</button>
        <label class="btn btn-sm">Importer JSON<input type="file" id="bImport" accept=".json" hidden></label>
        <button class="btn btn-sm" id="bExport">Exporter JSON</button>
      </div></details>
      <button class="btn btn-sm" id="bAide" title="Aide et raccourcis (H ou ?)">❔ Aide</button>
      <button class="btn btn-sm" id="bValider">Contrôler</button>
      <button class="btn btn-sm btn-primary" id="bPublier">Publier dans le jeu</button>
      <a class="btn btn-sm btn-ghost" href="index.html" style="text-decoration:none">⟵ Jeu</a>
    </header>
    <main id="screen" class="ed3 mode-construire">
      <aside class="formes"></aside>
      <section class="vp">
        <div id="edPrev"></div>
        <div class="vbar" id="niveaux"></div>
        <div class="vbar vtools">
          <button class="rond-s" data-rot="-45" title="Pivoter la vue (Q)">⟲</button><button class="rond-s" data-rot="45" title="Pivoter la vue (E)">⟳</button>
          <select class="sel-s" id="murs" title="Affichage des murs"><option value="bas">Murs bas</option><option value="auto">Murs auto</option><option value="pleins">Murs pleins</option></select>
          <label class="tog-s" title="Grille (G)"><input type="checkbox" id="grille" checked> Grille</label>
          <label class="tog-s" title="Couches de fouille retirées">⛏️ <input type="range" id="fouilleV" min="0" max="3" value="0"></label>
        </div>
        <aside class="listes"></aside>
        <aside class="insp"></aside>
        <div id="dims" hidden></div>
        <span id="pickHint" class="chip warn" hidden>📍 Cliquez dans la scène pour placer le point</span>
        <div class="barre">
          <nav class="b-modes" id="modes"></nav>
          <div class="b-droite">
            <div class="conseil" id="conseil"></div>
            <div class="b-cat" id="catalogue"></div>
            <div class="b-outils" id="outils"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="js/editor/editor.js"></script>
</body>
</html>
